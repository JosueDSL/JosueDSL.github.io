#   description  Optional short text under the title (Spanish).
#   models       Models in display order. Each item is a MakerWorld model URL
#                (https://makerworld.com/en/models/123456-whatever) or just its
#                numeric ID (123456). A trailing "# comment" is ignored — handy
#                for remembering what each ID is.
#
# Example entry to copy:
#
#   - url: https://makerworld.com/en/collections/12345678-my-collection
#     name: Mi colección
