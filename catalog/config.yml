# =============================================================================
# 3D-print catalog — the ONLY file you edit by hand.
#
# After editing, run the sync (locally `npm run catalog:sync`, or GitHub →
# Actions → "Sync catalog" → Run workflow). The sync writes
# catalog/data.generated.json and public/catalogo/img/ — never edit those.
# Full guide: CATALOG.md
# =============================================================================

# -----------------------------------------------------------------------------
# contact — where "Solicitar este modelo" sends customers.
# -----------------------------------------------------------------------------
contact:
  # WhatsApp number in international format, digits only (52 = Mexico).
  whatsapp: '523313404076'
  email: 'contact@josueds.me'

  # Message templates (Spanish). Placeholders:
  #   {name} → model name (after overrides)
  #   {link} → deep link to that model, e.g. https://www.josueds.me/catalogo/#m-123456
  whatsapp_message: '¡Hola! Me interesa el modelo {name} ({link}). ¿Me podrías dar más información?'
  email_subject: 'Solicitud de modelo: {name}'
  email_body: |-
    ¡Hola!

    Me interesa el modelo {name} ({link}).
    ¿Me podrías dar más información sobre tamaño, colores y tiempo de entrega?

    Gracias.

