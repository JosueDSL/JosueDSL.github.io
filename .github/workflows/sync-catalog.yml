name: Sync catalog

# Pulls model details and images from MakerWorld for the models listed in
# catalog/config.yml, commits any changes to main, and redeploys the site.
# Manual only (Actions → Sync catalog → Run workflow). To run it on a schedule,
# uncomment the `schedule` block below — see CATALOG.md.
on:
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: Accept a catalog more than 30% smaller than the current one
        type: boolean
        default: false
  # schedule:
  #   - cron: '0 9 * * 1' # Mondays 09:00 UTC

permissions:
  contents: read

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Only main deploys to Pages; refuse runs dispatched from other branches.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
      sync_failed: ${{ steps.sync.outputs.failed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The script never writes an unsafe catalog: on errors it keeps the last
      # good data and exits non-zero. Record the failure, still commit whatever
      # safe progress it made, and fail the run at the very end.
      - name: Sync from MakerWorld
        id: sync
        run: |
          if npm run catalog:sync -- ${{ inputs.allow_shrink && '--allow-shrink' || '' }}; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        id: commit
        run: |
          git add catalog/data.generated.json public/catalogo
          if git diff --cached --quiet; then
            echo "No catalog changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(catalog): sync from MakerWorld"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write

  report:
    needs: [sync, deploy]
    if: always() && needs.sync.outputs.sync_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Fail loudly
        run: |
          echo "::error::The catalog sync hit errors. The site kept the last good data for anything that failed. See the 'Sync from MakerWorld' step log for details."
          exit 1
